<script>
function handleVIPInput(input, activeTextId, resetTextId, resetTextDefault) {
    if (input.files && input.files[0]) {
        // Change text of clicked button to show success and file name
        let fileName = input.files[0].name;
        document.getElementById(activeTextId).innerText = "✅ " + fileName.substring(0, 12) + "...";
        // Reset the other button to its original text
        document.getElementById(resetTextId).innerText = resetTextDefault;
        
        // MAGIC TRICK: Transfer the selected file to the Main Master Input securely
        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(input.files[0]);
        document.getElementById('fileInput').files = dataTransfer.files;
    }
}
</script>

                    file: { name: file.name, mimeType: file.type, bytes: e.target.result.split(',')[1] }
                };

               // =========================================================

var GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbyOUE3mcaRZSHjDmr8umlkrDf1MmPFQKUUqvL3Id8DcRT4cfekO6kkyKxA3uJdSPHrjKA/exec";
